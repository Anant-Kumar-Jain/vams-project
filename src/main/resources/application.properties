# ----------------------------------------
# Database Connection Settings (Cloud Ready)
# ----------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/vams_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Hibernate / JPA Settings
# 'update' automatically creates database tables based on our Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Web Server Port (Render.com uses the PORT environment variable)
server.port=${PORT:8080}

# Thymeleaf Template Cache (Enabled by default in enterprise production for maximum performance)
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}


# TiDB Cloud HikariCP High-Throughput Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000



