<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Owner - Access Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="modern-auth-container">

<!-- Navbar -->
<nav class="navbar navbar-dark sticky-top" style="background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); box-shadow: 0 4px 15px rgba(13,110,253,0.3); z-index: 1050;">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center">
        <button class="btn btn-link text-white p-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#ownerSidebar">
          <i class="bi bi-list fs-2"></i>
        </button>
        <a class="navbar-brand fw-bold m-0" href="/owner/dashboard"><i class="bi bi-shield-check me-2"></i>Owner Panel</a>
    </div>
    <form th:action="@{/logout}" method="post" class="d-flex m-0">
        <button type="submit" class="btn btn-sm btn-light text-primary rounded-pill px-4 fw-bold shadow-sm">Logout</button>
    </form>
  </div>
</nav>

<!-- Offcanvas Sidebar -->
<div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="ownerSidebar" style="width: 280px; background: #ffffff;">
  <div class="offcanvas-header border-bottom px-4 py-3">
    <h5 class="offcanvas-title fw-bold text-primary"><i class="bi bi-shield-check me-2"></i>Menu</h5>
    <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-3">
    <div class="text-muted small fw-bold mb-3 px-3">DASHBOARD</div>
    <ul class="nav flex-column gap-2 mb-4">
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/dashboard"><i class="bi bi-grid-fill me-3 text-muted"></i>Overview</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/create-user"><i class="bi bi-person-plus-fill me-3 text-muted"></i>Create User</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-primary bg-primary bg-opacity-10" href="/owner/requests"><i class="bi bi-inbox-fill me-3"></i>Access Requests</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/users"><i class="bi bi-people-fill me-3 text-muted"></i>System Users</a>
      </li>
    </ul>
    
    <div class="text-muted small fw-bold mb-3 px-3">SYSTEM</div>
    <ul class="nav flex-column gap-2">
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/logs"><i class="bi bi-journal-text me-3 text-muted"></i>Audit Logs</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/gates"><i class="bi bi-door-open-fill me-3 text-muted"></i>Gates</a>
      </li>
    </ul>
  </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="modern-auth-card p-4 p-md-5 mb-5 shadow-sm">
                <h5 class="modern-auth-title fs-4 mb-4"><i class="bi bi-inbox-fill me-2"></i>Access Requests</h5>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 border">
                        <thead class="table-light">
                            <tr>
                                <th>Req ID</th>
                                <th>User</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${allRequests}">
                                <td class="text-secondary" th:text="${'#' + r.requestId}"></td>
                                <td class="fw-bold" th:text="${r.user.username}"></td>
                                <td>
                                    <span th:if="${r.status.name() == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                                    <span th:if="${r.status.name() == 'APPROVED'}" class="badge bg-success">APPROVED</span>
                                    <span th:if="${r.status.name() == 'REJECTED'}" class="badge bg-danger">REJECTED</span>
                                    <span th:if="${r.status.name() == 'SUSPENDED'}" class="badge bg-secondary">SUSPENDED</span>
                                    <span th:if="${r.status.name() == 'REVOKED'}" class="badge bg-dark">REVOKED</span>
                                </td>
                                <td class="text-end">
                                    <!-- Pending Actions -->
                                    <div th:if="${r.status.name() == 'PENDING'}">
                                        <form th:action="@{/owner/approve/{id}(id=${r.requestId})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-success rounded-pill px-3 shadow-sm"><i class="bi bi-check-lg"></i> Approve</button>
                                        </form>
                                        <form th:action="@{/owner/reject/{id}(id=${r.requestId})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger rounded-pill px-3 shadow-sm"><i class="bi bi-x-lg"></i> Reject</button>
                                        </form>
                                    </div>
                                    
                                    <!-- Post-Approval Actions (Three-Dot Menu) -->
                                    <div th:if="${r.status.name() != 'PENDING'}" class="dropdown d-inline-block">
                                        <button class="btn btn-sm btn-light border dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                            <i class="bi bi-three-dots-vertical"></i>
                                        </button>
                                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                            <li th:if="${r.status.name() == 'APPROVED'}">
                                                <form th:action="@{/owner/suspend/{id}(id=${r.requestId})}" method="post" class="m-0">
                                                    <button type="submit" class="dropdown-item text-warning fw-bold"><i class="bi bi-pause-circle me-2"></i>Suspend Access</button>
                                                </form>
                                            </li>
                                            <li th:if="${r.status.name() == 'SUSPENDED'}">
                                                <form th:action="@{/owner/reinstate/{id}(id=${r.requestId})}" method="post" class="m-0">
                                                    <button type="submit" class="dropdown-item text-success fw-bold"><i class="bi bi-play-circle me-2"></i>Reinstate Access</button>
                                                </form>
                                            </li>
                                            <li th:if="${r.status.name() == 'APPROVED' or r.status.name() == 'SUSPENDED'}">
                                                <hr class="dropdown-divider">
                                            </li>
                                            <li th:if="${r.status.name() == 'APPROVED' or r.status.name() == 'SUSPENDED'}">
                                                <form th:action="@{/owner/revoke/{id}(id=${r.requestId})}" method="post" class="m-0">
                                                    <button type="submit" class="dropdown-item text-danger fw-bold"><i class="bi bi-slash-circle me-2"></i>Revoke Permanently</button>
                                                </form>
                                            </li>
                                            <li th:if="${r.status.name() == 'REJECTED' or r.status.name() == 'REVOKED'}">
                                                <span class="dropdown-item text-muted small"><i class="bi bi-lock me-2"></i>Finalized</span>
                                            </li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(allRequests)}">
                                <td colspan="4" class="text-center text-muted py-3">No access requests found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
