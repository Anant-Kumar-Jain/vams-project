<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>VAMS - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <link href="/css/style.css?v=3" rel="stylesheet">
</head>
<body class="modern-auth-container d-flex align-items-center justify-content-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <div class="text-center mb-4">
                <h4 class="modern-auth-title mb-1">Reset Password</h4>
                <p class="modern-auth-subtitle mb-0">Enter your email to receive a reset code</p>
            </div>

            <div class="card modern-auth-card p-4">
                <div class="card-body p-0">
                    
                    <!-- STEP 1: Enter Email to Send Link -->
                    <div id="step1">
                        <div class="mb-4">
                            <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Email</label>
                            <div class="input-group modern-input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="emailInput" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="text-center mb-4">
                            <a th:href="@{/login}" class="modern-auth-link fw-bold">Back to Sign In</a>
                        </div>
                        
                        <button class="btn-primary-action w-100" onclick="sendLink()">Send Code</button>
                    </div>

                    <!-- STEP 2: Loading State when returning from Email -->
                    <div id="step2" style="display: none;" class="text-center py-4">
                        <h5 class="modern-auth-title mb-3">Authenticating link...</h5>
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>

                    <!-- STEP 3: Create New Password -->
                    <div id="step3" style="display: none;">
                        <p class="mb-3 text-success fw-bold text-center">✓ Email Verified Successfully!</p>
                        <form th:action="@{/reset-password}" method="post">
                            <input type="hidden" name="email" id="hiddenEmail">
                            
                            <div class="mb-4">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">New Password</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="newPassword" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn-primary-action w-100">Update Password</button>
                        </form>
                    </div>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCNVl1G3DJYO2bGPdnvkx5vRwiKRgVND8I",
        authDomain: "vams-project-e18dd.firebaseapp.com",
        projectId: "vams-project-e18dd",
        storageBucket: "vams-project-e18dd.firebasestorage.app",
        messagingSenderId: "753238530225",
        appId: "1:753238530225:web:09aa9a28e6666b5002aa90"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const actionCodeSettings = {
        url: '/forgot-password',
        handleCodeInApp: true,
    };

    function sendLink() {
        const email = document.getElementById('emailInput').value;
        if(email.trim() === '') { alert("Please enter your email."); return; }
        
        auth.sendSignInLinkToEmail(email, actionCodeSettings)
            .then(() => {
                window.localStorage.setItem('emailForPasswordReset', email);
                alert("Reset link sent! Please check your inbox (and spam folder) and click the link.");
            })
            .catch((error) => {
                alert("Error sending link: " + error.message);
            });
    }

    // Check if we are returning from an email link
    if (auth.isSignInWithEmailLink(window.location.href)) {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';

        let email = window.localStorage.getItem('emailForPasswordReset');
        if (!email) {
            email = window.prompt('Please provide your email for confirmation');
        }
        
        auth.signInWithEmailLink(email, window.location.href)
            .then((result) => {
                window.localStorage.removeItem('emailForPasswordReset');
                
                // Show Step 3
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
                document.getElementById('hiddenEmail').value = email;
            })
            .catch((error) => {
                alert("Error verifying email link: " + error.message);
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step1').style.display = 'block';
            });
    }
</script>
</body>
</html>
