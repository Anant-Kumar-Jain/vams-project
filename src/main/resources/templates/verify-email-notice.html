<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify Your Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="modern-auth-container d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="modern-auth-card p-5 shadow-lg text-center" style="max-width: 500px; width: 100%;">
    <div class="mb-4">
        <i class="bi bi-envelope-exclamation text-primary" style="font-size: 4rem;"></i>
    </div>
    
    <h3 class="fw-bold mb-3 text-dark">Check Your Inbox</h3>
    <p class="text-muted mb-4">
        Your account is registered, but your email address 
        <strong th:text="${userEmail}" class="text-primary"></strong> has not been verified yet. 
        You must verify your email to access the system.
    </p>

    <div id="statusMessage" class="alert d-none mb-4" role="alert"></div>

    <div class="d-grid gap-3">
        <!-- The button relies on the Firebase JS below -->
        <button id="resendBtn" class="btn btn-primary fw-bold py-2 rounded-3">
            <i class="bi bi-send me-2"></i>Resend Verification Email
        </button>
        
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light w-100 fw-bold py-2 rounded-3 border">
                <i class="bi bi-box-arrow-right me-2"></i>Sign Out
            </button>
        </form>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCNVl1G3DJYO2bGPdnvkx5vRwiKRgVND8I",
        authDomain: "vams-project-e18dd.firebaseapp.com",
        projectId: "vams-project-e18dd",
        storageBucket: "vams-project-e18dd.firebasestorage.app",
        messagingSenderId: "753238530225",
        appId: "1:753238530225:web:09aa9a28e6666b5002aa90"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userEmail = "[[${userEmail}]]";
    
    document.getElementById('resendBtn').addEventListener('click', () => {
        const btn = document.getElementById('resendBtn');
        const status = document.getElementById('statusMessage');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Sending...';
        
        const actionCodeSettings = {
            url: window.location.origin + '/api/verify-success?email=' + encodeURIComponent(userEmail),
            handleCodeInApp: true,
        };

        sendSignInLinkToEmail(auth, userEmail, actionCodeSettings)
            .then(() => {
                status.className = 'alert alert-success mb-4 rounded-3 border-0 border-start border-5 border-success';
                status.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Verification email sent successfully!';
                btn.innerHTML = '<i class="bi bi-send me-2"></i>Resend Verification Email';
                btn.disabled = false;
            })
            .catch((error) => {
                status.className = 'alert alert-danger mb-4 rounded-3 border-0 border-start border-5 border-danger';
                status.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>Error: ' + error.message;
                btn.innerHTML = '<i class="bi bi-send me-2"></i>Resend Verification Email';
                btn.disabled = false;
                console.error("Error sending verification email:", error);
            });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
