<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>VAMS - Pending Approval</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-white">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card rounded-0 border-dark">
                <div class="card-header rounded-0 border-dark border-bottom bg-warning text-dark">
                    <h5 class="mb-0 fw-bold">APPROVAL PENDING</h5>
                </div>
                <div class="card-body p-5">
                    <h4 class="mb-4">Account Under Review</h4>
                    <p class="text-muted mb-4">Your account has been successfully created, but your access request is currently <strong>PENDING</strong>.</p>
                    <p class="text-muted mb-5">Please wait until the Owner (Super Admin) reviews and approves your request to access the dashboard.</p>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="custom-btn">LOGOUT</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
