<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>VAMS - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css?v=3" rel="stylesheet">
</head>
<body class="modern-auth-container d-flex align-items-center justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            
            <div class="text-center mb-4">
                <h4 class="modern-auth-title mb-1">Create an Account</h4>
                <p class="modern-auth-subtitle mb-0">Sign up to get started</p>
            </div>

            <div class="card modern-auth-card p-4">
                <div class="card-body p-0">
                    
                    <div th:if="${error}" class="alert alert-danger rounded-3 p-2 small text-center" th:text="${error}"></div>
                    
                    <form th:action="@{/register}" th:object="${user}" method="post">
                        
                        <!-- Row 1: User ID & Full Name -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">User ID</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" th:field="*{username}" placeholder="Choose a username" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Full Name</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="John Doe" required>
                                </div>
                            </div>
                        </div>

                        <!-- Row 2: Email & Password -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Email</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Password</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
                                </div>
                            </div>
                        </div>

                        <!-- Row 3: Address & Purpose -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Address</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" class="form-control" placeholder="City or Office" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Purpose</label>
                                <div class="input-group modern-input-group">
                                    <span class="input-group-text"><i class="bi bi-clipboard"></i></span>
                                    <input type="text" class="form-control" placeholder="Reason for access" required>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Role Selection -->
                        <div class="mb-3 mt-4">
                            <label class="modern-auth-subtitle fw-bold mb-2 d-block" style="font-size: 0.8rem;">Select Role</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{role}" value="MANAGER" id="roleManager">
                                    <label class="form-check-label modern-auth-subtitle" for="roleManager">Manager</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{role}" value="EMPLOYEE" id="roleEmployee">
                                    <label class="form-check-label modern-auth-subtitle" for="roleEmployee">Employee</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{role}" value="GUEST" id="roleGuest" checked>
                                    <label class="form-check-label modern-auth-subtitle" for="roleGuest">Guest</label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Validity Options -->
                        <div class="mb-4">
                            <label class="modern-auth-subtitle fw-bold mb-2 d-block" style="font-size: 0.8rem;">Access Validity</label>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="validityType" value="INFINITE" id="validOngoing" checked>
                                <label class="form-check-label modern-auth-subtitle" for="validOngoing">
                                    Ongoing <span class="text-muted small">(Infinite until removed)</span>
                                </label>
                            </div>
                            
                            <div class="form-check d-flex align-items-center flex-wrap gap-2">
                                <input class="form-check-input mt-0" type="radio" name="validityType" value="SPECIFIC" id="validSpecific">
                                <label class="form-check-label modern-auth-subtitle me-2" for="validSpecific">Specific Time:</label>
                                
                                <input type="date" class="form-control form-control-sm modern-input-group w-auto" style="border: 1px solid #E0E0E0 !important; background-color: #F8F9FA !important; border-radius: 8px !important;">
                                <input type="time" class="form-control form-control-sm modern-input-group w-auto" style="border: 1px solid #E0E0E0 !important; background-color: #F8F9FA !important; border-radius: 8px !important;">
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn-primary-action w-100 mt-2">Sign Up</button>

                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <span class="modern-auth-subtitle">Already have an account? </span>
                <a th:href="@{/login}" class="modern-auth-link fw-bold text-decoration-none" style="color: var(--color-primary-blue) !important;">Sign In</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
