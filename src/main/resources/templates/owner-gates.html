<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Owner - Gate Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="modern-auth-container">

<!-- Navbar -->
<nav class="navbar navbar-dark sticky-top" style="background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); box-shadow: 0 4px 15px rgba(13,110,253,0.3); z-index: 1050;">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center">
        <button class="btn btn-link text-white p-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#ownerSidebar">
          <i class="bi bi-list fs-2"></i>
        </button>
        <a class="navbar-brand fw-bold m-0" href="/owner/dashboard"><i class="bi bi-shield-check me-2"></i>Owner Panel</a>
    </div>
    <form th:action="@{/logout}" method="post" class="d-flex m-0">
        <button type="submit" class="btn btn-sm btn-light text-primary rounded-pill px-4 fw-bold shadow-sm">Logout</button>
    </form>
  </div>
</nav>

<!-- Offcanvas Sidebar -->
<div class="offcanvas offcanvas-start border-0 shadow" tabindex="-1" id="ownerSidebar" style="width: 280px; background: #ffffff;">
  <div class="offcanvas-header border-bottom px-4 py-3">
    <h5 class="offcanvas-title fw-bold text-primary"><i class="bi bi-shield-check me-2"></i>Menu</h5>
    <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-3">
    <div class="text-muted small fw-bold mb-3 px-3">DASHBOARD</div>
    <ul class="nav flex-column gap-2 mb-4">
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/dashboard"><i class="bi bi-grid-fill me-3 text-muted"></i>Overview</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/create-user"><i class="bi bi-person-plus-fill me-3 text-muted"></i>Create User</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/requests"><i class="bi bi-inbox-fill me-3 text-muted"></i>Access Requests</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/users"><i class="bi bi-people-fill me-3 text-muted"></i>System Users</a>
      </li>
    </ul>
    
    <div class="text-muted small fw-bold mb-3 px-3">SYSTEM</div>
    <ul class="nav flex-column gap-2">
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-dark" onmouseover="this.classList.add('bg-light')" onmouseout="this.classList.remove('bg-light')" href="/owner/logs"><i class="bi bi-journal-text me-3 text-muted"></i>Audit Logs</a>
      </li>
      <li class="nav-item">
        <a class="nav-link fw-semibold rounded-3 px-3 py-2 text-primary bg-primary bg-opacity-10" href="/owner/gates"><i class="bi bi-door-open-fill me-3"></i>Gates</a>
      </li>
    </ul>
  </div>
</div>

<div class="container py-5">
    
    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> Gate successfully registered!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4">
        <!-- Add New Gate -->
        <div class="col-md-4">
            <div class="modern-auth-card p-4 shadow-sm h-100">
                <h5 class="fw-bold mb-4 text-primary"><i class="bi bi-door-open me-2"></i>Register New Gate</h5>
                <form th:action="@{/owner/gates}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Gate Number / ID</label>
                        <input type="text" name="gateNo" class="form-control" placeholder="e.g. Gate 1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Location</label>
                        <input type="text" name="location" class="form-control" placeholder="e.g. Main Entrance" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Gate Permission Mode</label>
                        <select name="permission" class="form-select">
                            <option value="GENERAL">General (Both Entry & Exit)</option>
                            <option value="ENTRY_ONLY">Entry Only</option>
                            <option value="EXIT_ONLY">Exit Only</option>
                            <option value="RESTRICTED">Restricted (Assigned Only)</option>
                            <option value="LOCKED">Locked (No Scans Allowed)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill">Add Gate</button>
                </form>
            </div>
        </div>

        <!-- Master List of Gates -->
        <div class="col-md-8">
            <div class="modern-auth-card p-4 shadow-sm h-100">
                <h5 class="fw-bold mb-4"><i class="bi bi-list-columns-reverse me-2"></i>Registered Gates</h5>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-light">
                            <tr>
                                <th>Gate No</th>
                                <th>Location</th>
                                <th>Permission Mode</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="gate : ${allGates}">
                                <td class="fw-bold text-primary" th:text="${gate.gateNo}"></td>
                                <td th:text="${gate.location}"></td>
                                <td>
                                    <form th:action="@{/owner/gates/{id}/permission(id=${gate.id})}" method="post" class="d-flex align-items-center gap-1">
                                        <select name="permission" class="form-select form-select-sm fw-bold" style="width: auto; font-size: 0.8rem;" 
                                                th:classappend="${gate.permission.name() == 'GENERAL' ? 'text-success' : (gate.permission.name() == 'LOCKED' ? 'text-danger' : 'text-warning')}">
                                            <option value="GENERAL" th:selected="${gate.permission.name() == 'GENERAL'}">General</option>
                                            <option value="ENTRY_ONLY" th:selected="${gate.permission.name() == 'ENTRY_ONLY'}">Entry Only</option>
                                            <option value="EXIT_ONLY" th:selected="${gate.permission.name() == 'EXIT_ONLY'}">Exit Only</option>
                                            <option value="RESTRICTED" th:selected="${gate.permission.name() == 'RESTRICTED'}">Restricted</option>
                                            <option value="LOCKED" th:selected="${gate.permission.name() == 'LOCKED'}">Locked</option>
                                        </select>
                                        <button type="submit" class="btn btn-sm btn-light text-primary border" title="Save Permission"><i class="bi bi-check-lg"></i></button>
                                    </form>
                                </td>
                                <td class="text-end">
                                    <form th:action="@{/owner/gates/{id}/delete(id=${gate.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this gate?');" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-light text-danger border" title="Delete Gate"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(allGates)}">
                                <td colspan="4" class="text-center text-muted py-4">No gates registered yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
